<script>
const App = {
  state: { rotina: '', competencia: '', idRotina: '' },
  elements: {},

  init: () => {
    App.cacheElements();
    App.bindEvents();
    App.renderRotinaOptions();
    App.renderCompetenciaOptions();
    UI.mostrarTela('screenSelect');
  },

  cacheElements: () => {
    App.elements.rotinaSelect = UI.getById('rotina');
    App.elements.competenciaSelect = UI.getById('competencia');
    App.elements.continueButton = UI.getById('continueButton');
    App.elements.submitButton = UI.getById('submitButton');
    App.elements.newRoutineButton = UI.getById('newRoutineButton');
    App.elements.tituloRotina = UI.getById('tituloRotina');
  },

  bindEvents: () => {
    App.elements.continueButton.addEventListener('click', App.continuar);
    App.elements.submitButton.addEventListener('click', App.enviar);
    App.elements.newRoutineButton.addEventListener('click', App.novaRotina);
  },

  renderRotinaOptions: () => {
    App.elements.rotinaSelect.innerHTML = Templates.rotinaOptions();
  },

  renderCompetenciaOptions: () => {
    App.elements.competenciaSelect.innerHTML = Templates.competenciaOptions();
  },

  continuar: async () => {
    if (UI.isLoading) {
      return;
    }

    const rotina = App.elements.rotinaSelect.value;
    const competencia = App.elements.competenciaSelect.value;
    const rotinaOption = App.elements.rotinaSelect.options[App.elements.rotinaSelect.selectedIndex];
    const idRotina = rotinaOption?.dataset?.id || '';

    if (!rotina) {
      UI.showMessage(FRONTEND_CONSTANTS.MESSAGES.selecioneRotina);
      return;
    }

    if (!competencia) {
      UI.showMessage('Selecione a competência do relatório.');
      return;
    }

    try {
      const validacao = await Api.validarRotina({ id_rotina: idRotina, competencia, rotina });
      if (validacao?.jaExiste) {
        UI.showMessage(validacao.mensagem || 'Essa rotina já foi atualizada para essa competência.');
        return;
      }

      UI.clearMessage();
      App.state.rotina = rotina;
      App.state.competencia = competencia;
      App.state.idRotina = idRotina;
      UI.setText('tituloRotina', rotina);
      FormBuilder.construirFormulario();
      UI.mostrarTela('screenForm');
    } catch (error) {
      UI.showMessage(error.message || 'Não foi possível validar a rotina.');
    }
  },

  enviar: async () => {
    if (UI.isLoading) {
      return;
    }

    const erro = Validation.validarFormulario();
    if (erro) {
      return UI.showError(erro);
    }

    try {
      const resultados = await FormBuilder.montarResultados();
      await Api.salvarRotina(resultados);
      UI.mostrarTela('screenSuccess');
    } catch (error) {
      UI.showError(`Erro ao salvar: ${error.message}`);
    }
  },

  novaRotina: () => {
    App.state.rotina = '';
    App.state.competencia = '';
    App.state.idRotina = '';
    App.elements.rotinaSelect.value = '';
    App.elements.competenciaSelect.value = '';
    UI.clearMessage();
    FormBuilder.reset();
    UI.mostrarTela('screenSelect');
  },
};

document.addEventListener('DOMContentLoaded', App.init);
</script>
