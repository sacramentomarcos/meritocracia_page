const FormBuilder = {
  construirFormulario: () => {
    const lista = UI.getById('lista');
    UI.clearContainer(lista);
    const html = FRONTEND_CONSTANTS.EMPRESAS.map((empresa, index) => Templates.companyCard(empresa, index)).join('');
    lista.innerHTML = html;
    FormBuilder.bindUploadEvents();
    FormBuilder.bindRadioEvents();
  },

  bindUploadEvents: () => {
    document.querySelectorAll('.company').forEach((companyElement) => {
      const uploadArea = companyElement.querySelector('.upload-area');
      const fileInput = companyElement.querySelector('.input-file');
      const previewContainer = companyElement.querySelector('.preview-container');
      const textarea = companyElement.querySelector('textarea');
      const extra = companyElement.querySelector('.extra');
      const fileStore = [];

      uploadArea.addEventListener('click', () => fileInput.click());
      textarea.addEventListener('paste', (event) => Upload.handlePaste(event, fileStore, previewContainer, fileInput));
      uploadArea.addEventListener('paste', (event) => Upload.handlePaste(event, fileStore, previewContainer, fileInput));
      fileInput.addEventListener('change', (event) => Upload.handleFileInput(event, fileStore, previewContainer));

      companyElement.dataset.fileStore = JSON.stringify(fileStore);
      Upload.initializePreviewState(companyElement, fileStore, previewContainer, fileInput);
    });
  },

  bindRadioEvents: () => {
    document.querySelectorAll('.company').forEach((companyElement) => {
      const radios = companyElement.querySelectorAll('input[type=radio]');
      const extra = companyElement.querySelector('.extra');

      radios.forEach((radio) => {
        radio.addEventListener('change', () => {
          extra.style.display = radio.value === 'NAO' ? 'block' : 'none';
        });
      });
    });
  },

  montarResultados: async () => {
    const resultados = [];
    const companies = document.querySelectorAll('.company');

    for (let index = 0; index < companies.length; index += 1) {
      const companyElement = companies[index];
      const empresa = FRONTEND_CONSTANTS.EMPRESAS[index];
      const radio = companyElement.querySelector(`input[name="empresa${index}"]:checked`);
      const justificativa = companyElement.querySelector('textarea').value.trim();
      const arquivos = Array.from(companyElement.querySelector('.input-file').files);
      const arquivosBase64 = await Promise.all(arquivos.map((file) => Upload.arquivoParaBase64(file)));

      resultados.push({
        id_empresa: empresa.substring(0, 3),
        id_rotina: App.state.idRotina,
        rotina: App.state.rotina,
        competencia: App.state.competencia,
        status: radio.value,
        justificativa,
        arquivos: arquivosBase64,
      });
    }

    return resultados;
  },

  reset: () => {
    UI.clearContainer(UI.getById('lista'));
  },
};

const Api = {
  callServer: (functionName, data) => {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)[functionName](data);
    });
  },

  salvarRotina: (dados) => Api.callServer('salvarRotina', dados),
  validarRotina: (dados) => Api.callServer('validarRotinaNaCompetencia', dados),
};

const UI = {
  mostrarTela: (screenId) => {
    document.querySelectorAll('.screen').forEach((element) => element.classList.remove('active'));
    const screen = UI.getById(screenId);
    if (screen) {
      screen.classList.add('active');
    }
  },

  getById: (id) => document.getElementById(id),

  setText: (id, text) => {
    const element = UI.getById(id);
    if (element) {
      element.innerText = text;
    }
  },

  showError: (message) => {
    alert(message);
  },

  showMessage: (message) => {
    const element = UI.getById('validationMessage');
    if (!element) {
      return;
    }

    element.innerText = message || '';
    element.style.display = message ? 'block' : 'none';
  },

  clearMessage: () => UI.showMessage(''),

  clearContainer: (element) => {
    if (element) {
      element.innerHTML = '';

};

const Upload = {
  arquivoParaBase64: (file) => {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const base64Content = reader.result.split(',')[1];
        resolve({ name: file.name, type: file.type, base64Content });
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  },

  getFileName: (file, index) => {
    if (!file.name || file.name === 'image.png') {
      return `print_${Date.now()}_${index + 1}.png`;
    }

    return file.name;
  },

  handleFileInput: (event, fileStore, previewContainer) => {
    const selectedFiles = Array.from(event.target.files || []);
    Upload.addFiles(selectedFiles, fileStore, previewContainer, event.target);
  },

  handlePaste: (event, fileStore, previewContainer, fileInput) => {
    const clipboardData = event.clipboardData || event.originalEvent?.clipboardData;
    const clipboardItems = Array.from(clipboardData?.items || []);
    const imageFiles = clipboardItems
      .filter((item) => item.type.startsWith('image/'))
      .map((item) => item.getAsFile())
      .filter(Boolean);

    if (!imageFiles.length) {
      return;
    }
    
    event.preventDefault();
    Upload.addFiles(imageFiles, fileStore, previewContainer, fileInput);
  },

  addFiles: (files, fileStore, previewContainer, fileInput) => {
    files.forEach((file, index) => {
      const fileName = Upload.getFileName(file, index);
      const normalizedFile = new File([file], fileName, { type: file.type });
      fileStore.push(normalizedFile);
    });

    Upload.updateFileInput(fileInput, fileStore);
    Upload.renderPreview(fileStore, previewContainer, fileInput);
  },

  updateFileInput: (fileInput, fileStore) => {
    const dataTransfer = new DataTransfer();
    fileStore.forEach((file) => dataTransfer.items.add(file));
    fileInput.files = dataTransfer.files;
  },

  renderPreview: (fileStore, previewContainer, fileInput) => {
    previewContainer.innerHTML = '';

    fileStore.forEach((file, index) => {
      const previewItem = document.createElement('div');
      previewItem.className = 'preview-item';

      const isImage = file.type.startsWith('image/');
      if (isImage) {
        const image = document.createElement('img');
        const reader = new FileReader();
        reader.onload = (event) => { image.src = event.target.result; };
        reader.readAsDataURL(file);
        previewItem.appendChild(image);
      } else {
        const icon = document.createElement('div');
        icon.className = 'file-icon';
        icon.innerHTML = Upload.getFileIcon(file.name);
        previewItem.appendChild(icon);
      }

      const nameLabel = document.createElement('span');
      nameLabel.className = 'file-name';
      nameLabel.innerText = file.name;
      previewItem.appendChild(nameLabel);

      const removeButton = document.createElement('button');
      removeButton.className = 'btn-remove';
      removeButton.type = 'button';
      removeButton.innerText = '✖ Remover';
      removeButton.addEventListener('click', (event) => {
        event.stopPropagation();
        fileStore.splice(index, 1);
        Upload.updateFileInput(fileInput, fileStore);
        Upload.renderPreview(fileStore, previewContainer, fileInput);
      });

      previewItem.appendChild(removeButton);
      previewContainer.appendChild(previewItem);
    });
  },

  getFileIcon: (name) => {
    const extension = name.split('.').pop().toLowerCase();
    if (['xlsx', 'xls', 'csv'].includes(extension)) {
      return '📊';
    }
    if (['doc', 'docx'].includes(extension)) {
      return '📝';
    }
    if (extension === 'pdf') {
      return '📕';
    }
    return '📄';
  },

  initializePreviewState: (companyElement, fileStore, previewContainer, fileInput) => {
    companyElement.fileStore = fileStore;
    companyElement.previewContainer = previewContainer;
    companyElement.fileInput = fileInput;
    Upload.updateFileInput(fileInput, fileStore);
  },
};

const Validation = {
  validarFormulario: () => {
    const companies = document.querySelectorAll('.company');

    for (let index = 0; index < companies.length; index += 1) {
      const companyElement = companies[index];
      const radio = companyElement.querySelector(`input[name="empresa${index}"]:checked`);
      const justificativa = companyElement.querySelector('textarea').value.trim();
      const arquivos = Array.from(companyElement.querySelector('.input-file').files);

      if (!radio) {
        return FRONTEND_CONSTANTS.MESSAGES.respondaEmpresas;
      }

      if (radio.value === 'NAO' && justificativa.length === 0 && arquivos.length === 0) {
        return FRONTEND_CONSTANTS.MESSAGES.justificativaObrigatoria;
      }
    }

    return null;
  },
};

</script>
